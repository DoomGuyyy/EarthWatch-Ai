<style>
/* Layout: a full-screen 3D globe on deep space. Floating search and chips on top, a bottom sheet (phone) or left card (desktop) holds the area report. */
:root {
  --bg: #081535; --surface: #0f2250; --ink: #e6eeff; --muted: #93a6d1; --line: #27408a;
  --accent: #5ab8ff; --accent-ink: #04122e;
  --space-a: #15388f; --space-b: #061546;
  --good: #5cc98d; --warn: #e3a93a; --bad: #ee6a58;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; background: radial-gradient(ellipse at 50% 45%, var(--space-a), var(--space-b) 72%); }
#globe { position: absolute; inset: 0; z-index: 1; background: transparent; cursor: grab; touch-action: none; }
#globe:active { cursor: grabbing; }
#globe canvas { display: block; }
.glass { background: var(--surface); background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; min-height: 38px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.top { position: fixed; z-index: 1100; left: 0; right: 0; top: env(safe-area-inset-top, 0px); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 520px; }
.top > * { pointer-events: auto; }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; }
.mark { width: 22px; height: 22px; border-radius: 50%; flex: none; background: radial-gradient(circle at 34% 30%, var(--accent), #123 70%); box-shadow: inset 0 0 0 2px var(--accent); }
h1 { font-family: var(--font-display); font-size: 1.02rem; line-height: 1; margin: 0; letter-spacing: -0.01em; }
.mode { font-family: var(--font-data); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 10px; color: var(--muted); white-space: nowrap; }
.mode[data-live="true"] { color: var(--good); border-color: var(--good); }
.search { position: relative; }
.search form { display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 14px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; padding: 7px 0; }
.search input::placeholder { color: var(--muted); }
.search button { border: 0; background: var(--accent); color: var(--accent-ink); }
#sugg { position: absolute; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 4px; list-style: none; max-height: 40vh; overflow-y: auto; }
#sugg li button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 10px; }
#sugg li button:hover { background: var(--bg); }
#sugg .c { font-family: var(--font-data); font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; white-space: nowrap; }
.chip small { font-family: var(--font-data); font-size: 0.68rem; color: var(--muted); margin-left: 6px; }
.chip[aria-pressed="true"] small { color: inherit; opacity: 0.85; }

.side { position: fixed; z-index: 1100; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 176px); display: flex; flex-direction: column; gap: 8px; }
.side button { width: 44px; height: 44px; padding: 0; font-size: 1.25rem; line-height: 1; display: grid; place-items: center; }
.side svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#layerMenu { position: fixed; z-index: 1300; right: calc(max(12px, env(safe-area-inset-right, 0px)) + 54px); top: calc(env(safe-area-inset-top, 0px) + 176px); width: 230px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
#layerMenu p { margin: 0 0 2px; font-family: var(--font-data); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#layerMenu .hint { text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-size: 0.78rem; }
#layerMenu button { text-align: left; }
#layerList { display: flex; flex-direction: column; gap: 6px; }

#sheet { position: fixed; z-index: 1200; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; }
#sheetBody { overflow-y: auto; overscroll-behavior: contain; padding: 4px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
#toggle { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; min-height: 34px; padding: 4px 10px; font-size: 0.82rem; z-index: 2; }
.grip { height: 4px; width: 38px; border-radius: 2px; background: var(--line); margin: 8px auto 4px; flex: none; }
.loc { display: flex; flex-direction: column; gap: 2px; padding-right: 84px; }
.loc .name { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.2; text-wrap: balance; }
.loc .coord { font-family: var(--font-data); font-size: 0.78rem; color: var(--muted); }
.details { display: flex; flex-direction: column; gap: 16px; }
#sheet[data-collapsed="true"] .details { display: none; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h2 { margin: 0; font-family: var(--font-data); font-weight: 500; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.src { text-transform: none; letter-spacing: 0; }
.level { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.level .word { font-family: var(--font-display); font-size: 2rem; line-height: 1; }
.level .score { font-family: var(--font-data); color: var(--muted); font-size: 0.85rem; }
.level[data-l="Low"] .word { color: var(--good); }
.level[data-l="Moderate"] .word { color: var(--warn); }
.level[data-l="High"] .word { color: var(--bad); }
.gauge { position: relative; height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--good), var(--warn) 55%, var(--bad)); }
.needle { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stat .v { font-family: var(--font-data); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 0.72rem; color: var(--muted); margin-left: 3px; }
.stat .k { font-size: 0.78rem; color: var(--muted); }

.rainhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rainhead .big { font-family: var(--font-display); font-size: 2.3rem; line-height: 1; color: #8fd3ff; font-variant-numeric: tabular-nums; }
.rainhead .big small { font-size: 0.95rem; color: var(--muted); margin-left: 4px; font-family: var(--font-body); }
.rainhead .word { font-size: 0.9rem; color: var(--muted); }
.meters { display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 10px; background: rgba(90, 184, 255, 0.07); border: 1px solid var(--line); }
.mh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.85rem; margin-bottom: 5px; }
.mh b { font-family: var(--font-data); font-weight: 500; font-variant-numeric: tabular-nums; }
.mh small { color: var(--muted); margin-left: 3px; }
.bar { height: 8px; border-radius: 5px; background: rgba(147, 166, 209, 0.18); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #2d7dff, #7fe0ff); }
.bar.soil i { background: linear-gradient(90deg, #c9a063, #4cb4d8 60%, #2d7dff); }
.issues { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 0.8rem; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; font-weight: 500; }
.pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); } .pill.good { color: var(--good); }
.summary { margin: 0; padding: 12px; border-radius: 8px; background: var(--bg); max-width: 65ch; }
.feat { margin: 0; color: var(--muted); font-size: 0.9rem; }
.note { color: var(--muted); font-size: 0.8rem; margin: 0; max-width: 75ch; }
.hint { font-size: 0.88rem; color: var(--muted); margin: 0; }
#toast { position: fixed; z-index: 1400; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 70px); padding: 8px 14px; font-size: 0.85rem; max-width: 90%; }

.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rankrow { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 6px 10px; min-height: 44px; }
.rankrow .n { flex: 1; min-width: 0; }
.rankrow .n small { display: block; color: var(--muted); font-size: 0.72rem; }
.rankrow .r { font-family: var(--font-data); font-size: 0.78rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rankrow .pill { font-size: 0.72rem; padding: 1px 8px; }
/* the dropped pin */
.pinhost { width: 0; height: 0; position: relative; pointer-events: none; }
.pin { position: absolute; left: -15px; bottom: 0; width: 30px; height: 40px; transform-origin: 50% 100%; animation: drop 0.7s cubic-bezier(0.3, 1.4, 0.5, 1) both; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.45)); }
.pin svg { width: 100%; height: 100%; display: block; }
@keyframes drop { 0% { transform: translateY(-170px) scaleY(1.15); opacity: 0; } 55% { opacity: 1; } 78% { transform: translateY(0) scaleY(0.82); } 100% { transform: translateY(0) scaleY(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pin { animation: none; } }

@media (max-width: 860px) {
  #sheet { left: 0; right: 0; bottom: 0; max-height: 52%; border-radius: 16px 16px 0 0; border-bottom: 0; box-shadow: 0 -6px 24px rgba(0,0,0,0.18); }
  #sheetBody { padding-top: 10px; }
}
@media (min-width: 861px) {
  #sheet { left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 176px); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 380px; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,0.2); height: fit-content; max-height: calc(100% - 192px); }
  .grip { display: none; }
  #sheetBody { padding-top: 14px; }
  .top { right: auto; width: 520px; }
  .side { top: calc(env(safe-area-inset-top, 0px) + 12px); }
  #layerMenu { top: calc(env(safe-area-inset-top, 0px) + 12px); }
}
</style>

<script>
(function () {

  function draw() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2), w = window.innerWidth, h = window.innerHeight;

    var n = Math.round(w * h / 2600);
    for (var i = 0; i < n; i++) {
      var px = seed(i) * w, py = seed(i + 9000) * h, r = 0.25 + Math.pow(seed(i + 5000), 3) * 1.1, a = 0.3 + seed(i + 7000) * 0.7, t = seed(i + 3000);

    { id: "ndvi", label: "Vegetation (NDVI)", layer: "MODIS_Terra_NDVI_8Day", alpha: 0.75, on: false, img: null },

    { id: "fire", label: "Active fires", layer: "VIIRS_SNPP_Thermal_Anomalies_375m_All", alpha: 1, on: false, img: null }
  ];
  var baseImg = null, texUrl = null, layerBtns = {};
  function compose() {
    return new Promise(function (resolve) {
      if (!baseImg) { resolve(); return; }
      var c = document.createElement("canvas"); c.width = 4096; c.height = 2048;
      var x = c.getContext("2d");
      x.drawImage(baseImg, 0, 0, 4096, 2048);
      LAYERS.forEach(function (l) { if (l.on && l.img) { x.globalAlpha = l.alpha; x.drawImage(l.img, 0, 0, 4096, 2048); x.globalAlpha = 1; } });
      c.toBlob(function (b) {
        if (!b) { resolve(); return; }
        var u = URL.createObjectURL(b);
        globe.globeImageUrl(u);
        var old = texUrl; texUrl = u;
        if (old) setTimeout(function () { URL.revokeObjectURL(old); }, 4000);
        resolve();
      }, "image/jpeg", 0.92);
    });
  }
  LAYERS.forEach(function (L0) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = L0.label; b.disabled = true; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", async function () {
      if (!L0.on && !L0.img) {
        toast("Loading " + L0.label + " from NASA…"); b.disabled = true;
        try { L0.img = await withTimeout(loadImg(wms(L0.layer, "image/png", 4096, 2048)), 30000); }
        catch (e) { b.disabled = false; toast("Could not load this layer right now."); return; }
        b.disabled = false;
      }
      L0.on = !L0.on; b.setAttribute("aria-pressed", String(L0.on));
      await compose();
    });
    $("layerList").appendChild(b); layerBtns[L0.id] = b;
  });
  function setLayerHint() { $("layerHint").textContent = baseOK ? "Base globe: NASA Blue Marble. Overlays come from NASA GIBS." : "Layers unlock when NASA imagery can load (open the downloaded copy in Chrome)."; }
  setLayerHint();
  (async function loadBase() {
    try { baseImg = await withTimeout(loadImg(wms("BlueMarble_ShadedRelief_Bathymetry", "image/jpeg", 4096, 2048)), 30000); }
    catch (e) { try { baseImg = await withTimeout(loadImg(FALLBACK_IMG), 25000); } catch (e2) { baseImg = null; } }
    if (baseImg) {
      baseOK = true; await compose();
      LAYERS.forEach(function (L0) { layerBtns[L0.id].disabled = false; });
      setLayerHint(); setMode();
    }
  })();

  $("layersBtn").addEventListener("click", function () {
    var m = $("layerMenu"); m.hidden = !m.hidden; this.setAttribute("aria-expanded", String(!m.hidden));
  });
  $("zin").addEventListener("click", function () { var p = globe.pointOfView(); globe.pointOfView({ lat: p.lat, lng: p.lng, altitude: clamp(p.altitude * 0.55, 0.07, 4) }, 500); });
  $("zout").addEventListener("click", function () { var p = globe.pointOfView(); globe.pointOfView({ lat: p.lat, lng: p.lng, altitude: clamp(p.altitude * 1.8, 0.07, 4) }, 500); });
  $("locate").addEventListener("click", function () {
    if (!navigator.geolocation) { toast("Location is not available here."); return; }
    try {
      navigator.geolocation.getCurrentPosition(function (p) { goTo(p.coords.latitude, p.coords.longitude, 6, null); },
        function () { toast("Location is blocked in this view. Search for a place instead."); }, { timeout: 8000 });
    } catch (e) { toast("Location is blocked in this view. Search for a place instead."); }
  });

  /* ---------- selecting a place ---------- */
  function setMode() {
    $("mode").textContent = liveOK ? "Live NASA data" : "Sample data";
    $("mode").dataset.live = String(liveOK);
    var n = $("modeNote"); if (n) n.textContent = modeNoteText();
  }
  async function select(lat, lon, name) {
    indiaMode = false; indiaTok++;
    lat = clamp(lat, -85, 85); lon = wrapLon(lon);
    current = { lat: lat, lon: lon, name: name };
    dropPin(lat, lon);
    var my = ++token, d, label = name;
    if (liveOK) {
      renderLoading(lat, lon);
      var r = await Promise.allSettled([live(lat, lon), name ? Promise.resolve(name) : reverseName(lat, lon)]);
      d = r[0].status === "fulfilled" ? r[0].value : sample(lat, lon);
      if (!label) label = (r[1].status === "fulfilled" && r[1].value) || offlineLabel(lat, lon);
    } else {
      d = sample(lat, lon);
      if (!label) label = offlineLabel(lat, lon);
    }
    if (my !== token) return;
    render(lat, lon, d, label);
  }
  function goTo(lat, lon, z, name) { focus(lat, lon, zAlt(z)); select(lat, lon, name); }
  function tapSelect(lat, lng) {
    $("sugg").hidden = true; $("layerMenu").hidden = true; $("layersBtn").setAttribute("aria-expanded", "false");
    var alt = camAlt();
    focus(lat, lng, alt > 1.3 ? 0.9 : alt);
    select(lat, lng, null);
  }

  /* ---------- India overview ---------- */
  var indiaMode = false, indiaTok = 0, indiaRows = [];
  var LV_COLOR = { High: "#ee6a58", Moderate: "#e3a93a", Low: "#5cc98d" };
  function paintDots() {
    var data = indiaRows.map(function (r) { return { lat: r.s.lat, lng: r.s.lon, color: LV_COLOR[r.a.level] }; });
    globe.pointsData(data).pointLat("lat").pointLng("lng").pointColor("color").pointAltitude(0.014).pointRadius(0.42).pointsMerge(true);
  }
  function renderIndia(finished) {
    var rows = indiaRows.map(function (r, i) { r.i = i; return r; }).sort(function (a, b) { return b.a.score - a.a.score; });
    var hi = 0, mo = 0, lo = 0, liveN = 0;
    rows.forEach(function (r) { if (r.a.level === "High") hi++; else if (r.a.level === "Moderate") mo++; else lo++; if (r.live) liveN++; });
    var srcTxt = liveN === 0 ? "sample values" : liveN === rows.length ? "NASA POWER" : "NASA POWER + sample";
    body.innerHTML =
      '<div class="loc"><span class="name">India at a glance</span><span class="coord">' + rows.length + " of " + STATES.length + " states and territories" + (finished ? "" : " · reading NASA data…") + "</span></div>" +
      '<div class="issues"><span class="pill bad">' + hi + ' high</span><span class="pill warn">' + mo + ' moderate</span><span class="pill good">' + lo + " low</span></div>" +
      '<div class="details"><div class="sec"><h2>Flood risk by state <span class="src">' + srcTxt + '</span></h2><ul class="rank">' +
      rows.map(function (r) {
        var c = r.a.level === "High" ? "bad" : r.a.level === "Moderate" ? "warn" : "good";
        return '<li><button type="button" class="rankrow" data-i="' + r.i + '"><span class="n">' + esc(r.s.name) + "<small>" + esc(r.s.cap) + '</small></span><span class="r">' + r.d.rain7 + ' mm / 7 d</span><span class="pill ' + c + '">' + r.a.level + "</span></button></li>";
      }).join("") + '</ul></div><p class="note">Each state is read at its capital. Tap a row to open that state, or tap anywhere on the globe. Risk levels are rule-based estimates, not official warnings.</p></div>';
  }
  async function loadIndia() {
    var my = ++indiaTok, queue = STATES.slice(), rows = [], count = 0;
    indiaRows = rows; paintDots(); renderIndia(false);
    async function worker() {
      while (queue.length && my === indiaTok) {
        var s = queue.shift(), d = sample(s.lat, s.lon), live = false;
        if (liveOK) {
          try { var v = await livePower(s.lat, s.lon); d = Object.assign(d, v); d.src = { rain: "NASA POWER", veg: "sample" }; live = true; } catch (e) { /* keep sample */ }
        }
        if (my !== indiaTok) return;
        rows.push({ s: s, d: d, a: analyse(d), live: live });
        count++;
        if (count % 6 === 0 || !queue.length) { paintDots(); if (indiaMode) renderIndia(count >= STATES.length); }
      }
    }
    await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
    if (my === indiaTok) { paintDots(); if (indiaMode) renderIndia(true); }
  }
  function showIndia() {
    indiaMode = true; token++; current = null;
    globe.htmlElementsData([]); globe.ringsData([]);
    focus(22.5, 80.5, 1.0);
    loadIndia();
  }
  body.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".rankrow") : null;
    if (!b || !indiaRows.length) return;
    var r = indiaRows[+b.dataset.i]; if (!r) return;
    focus(r.s.lat, r.s.lon, 0.6); select(r.s.lat, r.s.lon, r.s.name + " (" + r.s.cap + ")");
  });

  /* tap detection: a short press with little movement drops a pin, a drag spins the globe */
  var down = null, activePointers = 0;
  globeEl.addEventListener("pointerdown", function (e) { activePointers++; down = activePointers > 1 ? null : { x: e.clientX, y: e.clientY, t: Date.now() }; });
  globeEl.addEventListener("pointercancel", function () { activePointers = Math.max(0, activePointers - 1); down = null; });
  globeEl.addEventListener("pointerup", function (e) {
    activePointers = Math.max(0, activePointers - 1);
    var d0 = down; down = null;
    if (!d0 || Math.hypot(e.clientX - d0.x, e.clientY - d0.y) > 8 || Date.now() - d0.t > 650) return;
    var rect = globeEl.getBoundingClientRect(), c = null;
    if (typeof globe.toGlobeCoords === "function") c = globe.toGlobeCoords(e.clientX - rect.left, e.clientY - rect.top);
    if (c && isFinite(c.lat) && isFinite(c.lng)) tapSelect(c.lat, c.lng);
    else if (c === null && typeof globe.toGlobeCoords === "function") { $("sugg").hidden = true; }
  });
  if (typeof globe.toGlobeCoords !== "function") globe.onGlobeClick(function (c) { tapSelect(c.lat, c.lng); });

  /* ---------- presets ---------- */
  var presetRow = $("presets");
  (function () {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip glass"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = "India<small>overview</small>";
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(presetRow.children, function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      showIndia();
    });
    presetRow.appendChild(b);
  })();
  PLACES.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip glass"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = esc(p.short) + "<small>" + esc(p.tag) + "</small>";
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(presetRow.children, function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      focus(p.lat, p.lon, 0.8); select(p.lat, p.lon, p.name);
    });
    presetRow.appendChild(b);
  });
  presetRow.children[0].setAttribute("aria-pressed", "true");

  /* ---------- search ---------- */
  var sugg = $("sugg"), q = $("q"), searchTimer, searchSeq = 0;
  function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function localMatches(text) {
    var t = norm(text.trim()), out = [];
    var m = t.match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
    if (m) { var la = parseFloat(m[1]), lo = parseFloat(m[2]); if (Math.abs(la) <= 90 && Math.abs(lo) <= 180) out.push({ name: "Coordinates " + la + ", " + lo, lat: la, lon: lo, z: 6, coordsOnly: true }); }
    if (!t) return out;
    var all = [["India", 22.5, 80.5, 2]].concat(STATES.map(function (s) { return [s.name + ", India", s.lat, s.lon, 5]; })).concat(PLACES.map(function (p) { return [p.name, p.lat, p.lon, 5]; })).concat(GAZ);
    var starts = [], has = [];
    all.forEach(function (g) {
      var n = norm(g[0]);
      if (n.indexOf(t) === 0) starts.push(g); else if (n.indexOf(t) > -1) has.push(g);
    });
    starts.concat(has).slice(0, 6).forEach(function (g) { out.push({ name: g[0], lat: g[1], lon: g[2], z: g[3] || 7 }); });
    return out;
  }
  function showSugg(list) {
    sugg.innerHTML = "";
    if (!list.length) { sugg.hidden = true; return; }
    list.forEach(function (r) {
      var li = document.createElement("li"), b = document.createElement("button");
      b.type = "button";
      b.innerHTML = "<span>" + esc(r.name) + '</span><span class="c">' + fmtCoord(r.lat, r.lon).replace("  ", " ") + "</span>";
      b.addEventListener("click", function () { pick(r); });
      li.appendChild(b); sugg.appendChild(li);
    });
    sugg.hidden = false; sugg._list = list;
  }
  function pick(r) {
    q.value = r.coordsOnly ? "" : r.name; sugg.hidden = true; q.blur();
    goTo(r.lat, r.lon, r.z || 6, r.coordsOnly ? null : r.name);
  }
  async function onlineSearch(text, seq, base) {
    try {
      var res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&q=" + encodeURIComponent(text), { signal: timeout(6000) });
      var j = await res.json();
      if (seq !== searchSeq) return;
      var extra = j.map(function (x) {
        var nm = x.display_name.split(",").map(function (s) { return s.trim(); });
        var short = nm.length > 3 ? nm[0] + ", " + nm[1] + ", " + nm[nm.length - 1] : x.display_name;
        return { name: short, lat: parseFloat(x.lat), lon: parseFloat(x.lon), z: 7 };
      });
      showSugg(base.concat(extra).slice(0, 7));
    } catch (e) { /* the built-in list stays */ }
  }
  q.addEventListener("input", function () {
    var text = q.value, seq = ++searchSeq, base = localMatches(text);
    showSugg(base);
    clearTimeout(searchTimer);
    if (liveOK && text.trim().length > 2) searchTimer = setTimeout(function () { onlineSearch(text, seq, base); }, 400);
  });
  $("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var list = sugg._list && !sugg.hidden ? sugg._list : localMatches(q.value);
    if (list.length) pick(list[0]);
    else toast("No match found. Try a city name or coordinates like 23.8, 90.4.");
  });

  /* ---------- start ---------- */
  var first = PLACES[0];
  setMode();
  showIndia();
  livePower(first.lat, first.lon).then(function () {
    liveOK = true; setMode();
    if (indiaMode) loadIndia(); else if (current) select(current.lat, current.lon, current.name);
  }).catch(function () { liveOK = false; setMode(); });
})();
</script>

</body>
